<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <title>Espace entraînement de Bloc Nord</title>
  <!-- Mur béton, sol -->
  <rect width="1200" height="900" fill="#d6d2cc"/>
  <g fill="#cbc6bf"><rect x="0" y="0" width="300" height="680"/><rect x="600" y="0" width="300" height="680"/></g>
  <rect y="680" width="1200" height="220" fill="#7d7a76"/>
  <!-- Tapis -->
  <rect x="40" y="700" width="1120" height="120" fill="#1d1d1d"/>
  <rect x="40" y="800" width="1120" height="20" fill="#ff6a13"/>
  <g stroke="#2e2e2e" stroke-width="4"><line x1="320" y1="700" x2="320" y2="800"/><line x1="600" y1="700" x2="600" y2="800"/><line x1="880" y1="700" x2="880" y2="800"/></g>
  <!-- Pan Güllich : panneau en dévers, barreaux de bois -->
  <polygon points="90,60 560,60 600,690 50,690" fill="#2b2b2b"/>
  <polygon points="90,60 560,60 566,100 86,100" fill="#ff6a13"/>
  <g fill="#c98a4b">
    <rect x="96" y="150" width="462" height="22" rx="4"/>
    <rect x="92" y="230" width="472" height="22" rx="4"/>
    <rect x="88" y="310" width="482" height="22" rx="4"/>
    <rect x="82" y="390" width="494" height="22" rx="4"/>
    <rect x="78" y="470" width="504" height="22" rx="4"/>
    <rect x="72" y="550" width="514" height="22" rx="4"/>
  </g>
  <g fill="#dca267">
    <rect x="96" y="150" width="462" height="7" rx="3"/><rect x="92" y="230" width="472" height="7" rx="3"/>
    <rect x="88" y="310" width="482" height="7" rx="3"/><rect x="82" y="390" width="494" height="7" rx="3"/>
    <rect x="78" y="470" width="504" height="7" rx="3"/><rect x="72" y="550" width="514" height="7" rx="3"/>
  </g>
  <!-- Traces de magnésie -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="230" cy="236" rx="22" ry="6"/><ellipse cx="410" cy="316" rx="20" ry="6"/>
    <ellipse cx="300" cy="396" rx="24" ry="6"/><ellipse cx="460" cy="156" rx="18" ry="5"/>
  </g>
  <!-- Poutre d'entraînement -->
  <rect x="690" y="150" width="400" height="20" fill="#1d1d1d"/>
  <rect x="720" y="170" width="340" height="110" rx="12" fill="#c98a4b"/>
  <g fill="#7a4f25">
    <rect x="745" y="190" width="70" height="22" rx="10"/><rect x="845" y="190" width="70" height="22" rx="10"/><rect x="945" y="190" width="90" height="22" rx="10"/>
    <ellipse cx="770" cy="248" rx="18" ry="14"/><ellipse cx="830" cy="248" rx="14" ry="12"/>
    <ellipse cx="950" cy="248" rx="14" ry="12"/><ellipse cx="1010" cy="248" rx="18" ry="14"/>
    <rect x="860" y="236" width="60" height="26" rx="13"/>
  </g>
  <!-- Prises murales turquoise -->
  <g fill="#3fb4bc">
    <circle cx="760" cy="380" r="16"/><circle cx="880" cy="420" r="12"/><circle cx="1000" cy="370" r="18"/>
    <circle cx="820" cy="500" r="14"/><circle cx="960" cy="520" r="16"/><circle cx="1080" cy="460" r="12"/>
  </g>
  <g fill="#ff6a13">
    <polygon points="700,440 730,430 724,462"/><polygon points="1040,560 1070,548 1068,580"/><polygon points="900,580 930,570 922,602"/>
  </g>
  <!-- Kettlebell, seau de magnésie -->
  <g transform="translate(930 640)">
    <path d="M18 28 Q18 0 50 0 Q82 0 82 28" stroke="#111111" stroke-width="12" fill="none"/>
    <circle cx="50" cy="54" r="36" fill="#ff6a13"/>
    <rect x="34" y="48" width="32" height="12" rx="4" fill="#111111"/>
  </g>
  <g transform="translate(1060 650)">
    <path d="M0 0 L60 0 L54 60 L6 60 Z" fill="#3fb4bc"/>
    <ellipse cx="30" cy="0" rx="30" ry="8" fill="#f3f1ee"/>
  </g>
</svg>

  <rect x="880" y="140" width="320" height="500" fill="#d9e9ea"/>
  <g stroke="#bcd3d5" stroke-width="3">
    <line x1="880" y1="220" x2="1200" y2="220"/><line x1="880" y1="300" x2="1200" y2="300"/>
    <line x1="880" y1="380" x2="1200" y2="380"/><line x1="880" y1="460" x2="1200" y2="460"/>
    <line x1="880" y1="540" x2="1200" y2="540"/>
    <line x1="960" y1="140" x2="960" y2="640"/><line x1="1040" y1="140" x2="1040" y2="640"/>
    <line x1="1120" y1="140" x2="1120" y2="640"/>
  </g>
  <rect x="872" y="140" width="16" height="500" fill="#1d1d1d"/>
  <g fill="#1d1d1d">
    <rect x="1000" y="190" width="10" height="70"/>
    <rect x="1000" y="190" width="70" height="10"/>
    <path d="M1048 200 L1092 200 L1100 222 L1040 222 Z"/>
  </g>
  <g fill="#3fb4bc">
    <rect x="1050" y="240" width="5" height="26" rx="2"/><rect x="1068" y="252" width="5" height="26" rx="2"/>
    <rect x="1086" y="238" width="5" height="26" rx="2"/><rect x="1058" y="296" width="5" height="26" rx="2"/>
    <rect x="1078" y="310" width="5" height="26" rx="2"/>
  </g>
  <rect x="980" y="560" width="160" height="12" fill="#1d1d1d" opacity="0.25"/>
  <!-- Plante -->
  <rect x="1110" y="560" width="70" height="80" fill="#c98a4b"/>
  <path d="M1145 560 Q1100 500 1112 440 Q1140 500 1145 560 Q1160 470 1200 450 Q1180 520 1145 560" fill="#2f7d55"/>
</svg>
